<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carcassonne Map Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title-section">
            <img src="images/title.png" alt="Title" class="title-image">
        </div>
        <div class="content-wrapper">
            <div class="main-zone">
                <div class="zoom-controls">
                    <button class="zoom-button" id="zoom-out">-</button>
                    <button class="zoom-button" id="zoom-reset">Reset</button>
                    <button class="zoom-button" id="zoom-in">+</button>
                </div>
                <div class="image-area">
                    <div id="tile-grid" class="tile-grid"></div>
                </div>
            </div>
            <div class="sidebar-zone">
                <h2>Paramètres</h2>
                <div class="tabs-container">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="general">Général</button>
                        <button class="tab-button" data-tab="tiles">Tuiles</button>
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane active" id="tab-general">
                            <div class="parameters-content">
                                <div class="parameter-group">
                                    <label class="parameter-label">Taille de la grille (X)</label>
                                    <input type="number" id="grid-size-x" class="parameter-input" value="10" min="1" max="50">
                                    <label class="parameter-label">Taille de la grille (Y)</label>
                                    <input type="number" id="grid-size-y" class="parameter-input" value="10" min="1" max="50">
                                </div>
                                <div class="parameter-group">
                                    <label class="parameter-label">Première tuile</label>
                                    <div class="radio-group">
                                        <label class="radio-label">
                                            <input type="radio" name="first-tile" value="middle" checked>
                                            <span>Milieu</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="first-tile" value="top-left">
                                            <span>Haut gauche</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="first-tile" value="top-right">
                                            <span>Haut droite</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="first-tile" value="bottom-left">
                                            <span>Bas gauche</span>
                                        </label>
                                        <label class="radio-label">
                                            <input type="radio" name="first-tile" value="bottom-right">
                                            <span>Bas droite</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="button-group">
                                    <button class="apply-button" id="apply-grid-size">Appliquer</button>
                                    <button class="generate-button" id="generate-map">Générer</button>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane" id="tab-tiles">
                            <button class="export-button" id="export-tiles">Exporter les tuiles</button>
                            <div class="tiles-list" id="tiles-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="dist/script.js"></script>
    <script src="dist/alal.js"></script>
</body>
</html>
